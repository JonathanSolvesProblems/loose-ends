<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123024"/>
      <stop offset="100%" stop-color="#0b1c15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- eyebrow -->
  <text x="80" y="104" fill="#6bbf92" font-size="22" font-weight="700" letter-spacing="4">SLACK AGENT FOR GOOD</text>

  <!-- title -->
  <text x="80" y="250" fill="#f1f7f3" font-size="124" font-weight="700" letter-spacing="-2">Loose Ends</text>

  <!-- rule -->
  <rect x="80" y="290" width="120" height="5" rx="2.5" fill="#6bbf92"/>

  <!-- body -->
  <text x="80" y="372" fill="#c3d6cc" font-size="37">Catches asks in Slack that</text>
  <text x="80" y="422" fill="#f1f7f3" font-size="37" font-weight="600">nobody accepted.</text>

  <text x="80" y="500" fill="#c3d6cc" font-size="37">Refuses to mark them done until it finds</text>
  <text x="80" y="550" fill="#f1f7f3" font-size="37" font-weight="600">evidence the work actually happened.</text>

  <!-- badge -->
  <rect x="80" y="628" width="352" height="76" rx="38" fill="#1d3d2e" stroke="#dc9450" stroke-width="2.5"/>
  <text x="256" y="678" text-anchor="middle" fill="#dc9450" font-size="34" font-weight="700">closed &#8800; done</text>

  <!-- stat -->
  <text x="1120" y="660" text-anchor="end" fill="#6bbf92" font-size="60" font-weight="700">38%</text>
  <text x="1120" y="694" text-anchor="end" fill="#8fa89c" font-size="20">of &#8220;closed&#8221; referrals actually reached the client</text>
  <text x="1120" y="722" text-anchor="end" fill="#5f766c" font-size="17">JAMA Network Open, 2024</text>
</svg>
